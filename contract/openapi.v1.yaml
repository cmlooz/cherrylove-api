    FavoritePage:
      examples:
        - {"results": [{"id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "item_type": "memory", "item_id": "0193a5b2-8d4f-7e5b-a011-2c3d4e5f6071", "user_id": "0193a5b2-7c3e-7d4a-9f00-1b2c3d4e5f60", "item_date": "2026-10-31", "created_at": "2026-11-18T14:00:00Z"}], "next_cursor": null}
      type: object
      required: [results, next_cursor]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/Favorite" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # media
    UploadInput:
      examples:
        - {"media_id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "kind": "photo", "content_type": "image/jpeg", "size_bytes": 2483021}
      type: object
      required: [media_id, kind, content_type, size_bytes]
      properties:
        media_id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [photo, video, audio, avatar] }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, audio/mpeg, audio/mp4] }
        size_bytes: { type: integer, minimum: 1 }
    PresignedPost:
      examples:
        - {"url": "https://storage.example.com/cherrylove-media", "fields": {"key": "quarantine/0193a5b2-af61-7a7d-8233-4e5f60718293/0193a5b2-9e50-7f6c-b122-3d4e5f607182", "Content-Type": "image/jpeg", "policy": "eyJ…", "x-amz-signature": "3f2a…"}, "expires_at": "2026-11-18T14:05:00Z"}
      type: object
      required: [url, fields, expires_at]
      properties:
        url: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
