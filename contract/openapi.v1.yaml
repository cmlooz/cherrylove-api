openapi: 3.1.0
# CherryLove OpenAPI v1 contract (ADR-003 §1). Imported from API-001 in IMPL-API-001 F0.7; this file is now
# the source of truth. Any change is a contract change that Camilo approves explicitly. Conventions: ADR-003 §5.
x-doc:
  id: API-001
  status: approved
  approved_by: Camilo
  approved_at: 2026-11-12
  implements: [ADR-003, ADR-004, ADR-005, ADR-006, ADR-007, ADR-010, DATA-001]
info:
  title: CherryLove API
  version: 1.0.0
  license:
    name: Proprietary (private project)
    identifier: LicenseRef-Proprietary
  description: |
    Every v1 endpoint per module. Each 4xx response narrows `Problem.code` to the codes that endpoint can
    return (ADR-010 §2); validation errors carry `errors[].code` values from `FieldErrorCode` (DEC-046).
    Schema `default`s on upsert inputs apply on create only: an edit that omits the field keeps the stored
    value. IMPL-API-001 F0.8 added client-reported views (DEC-049) and `media_asset` sync changes (DEC-050).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: identity, description: "Auth, invites, onboarding, account (REQ-F-AUTH, REQ-F-ACC)" }
  - { name: home, description: "Couple header and favorites timeline (REQ-F-HOME)" }
  - { name: cards, description: "Daily cards (REQ-F-CARD)" }
  - { name: memories, description: "Memories, songs, places (REQ-F-MEM, REQ-F-SONG, REQ-F-PLACE)" }
  - { name: diary, description: "Notes (REQ-F-NOTE)" }
  - { name: favorites, description: "Personal favorites (REQ-F-FAV)" }
  - { name: media, description: "Uploads and signed URLs (ADR-007)" }
  - { name: notifications, description: "Devices and preferences (REQ-F-NOTIF)" }
  - { name: sync, description: "Offline push/pull (ADR-006)" }
  - { name: audit, description: "Client-reported view events (REQ-F-LOG-01, REQ-F-ADM-06, DEC-049)" }

paths:
  # ---------------------------------------------------------------- identity
  /auth/login:
    post:
      tags: [identity]
      operationId: identity_create_session
      summary: Log in (REQ-F-AUTH-07, ADR-004 §2)
      security: []
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Access token; web gets the refresh token as an HttpOnly cookie, mobile in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "409": { $ref: "#/components/responses/CoupleArchived" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/refresh:
    post:
      tags: [identity]
      operationId: identity_refresh_session
      summary: Rotate the refresh token (ADR-004 §2–3)
      security: [{ refreshCookie: [] }, {}]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/ClientHeader" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshInput" }
      responses:
        "200":
          description: New pair (same cookie/body rule as login).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ClientHeaderRequired" }
  /auth/logout:
    post:
      tags: [identity]
      operationId: identity_delete_session
      summary: Log out (REQ-F-ACC-06)
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/ClientHeader" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshInput" }
      responses:
        "204": { description: Refresh token blacklisted; cookie cleared on web. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ClientHeaderRequired" }
  /auth/password-recovery:
    post:
      tags: [identity]
      operationId: identity_request_password_recovery
      summary: Request recovery email (REQ-F-AUTH-08) — identical response whether the email exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"email": "camila@example.com"}
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "202": { description: Always accepted. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/password-recovery/confirm:
    post:
      tags: [identity]
      operationId: identity_confirm_password_recovery
      summary: Set a new password with the recovery token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"uid": "0193a5b2-7c3e-7d4a-9f00-1b2c3d4e5f60", "token": "c2V0LXBhc3N3b3Jk", "new_password": "a new long passphrase"}
            schema:
              type: object
              required: [uid, token, new_password]
              properties:
                uid: { type: string }
                token: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed; all sessions revoked. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /invites/{token}:
    get:
      tags: [identity]
      operationId: identity_get_invite
      summary: Open an invite (REQ-F-AUTH-02/04)
      security: []
      parameters: [{ $ref: "#/components/parameters/InviteToken" }]
      responses:
        "200":
          description: Invite is valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InviteConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /invites/{token}/accept:
    post:
      tags: [identity]
      operationId: identity_accept_invite
      summary: Complete onboarding (REQ-F-AUTH-03/04/05/06)
      security: []
      parameters: [{ $ref: "#/components/parameters/InviteToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "201":
          description: Account created and logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InviteConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me:
    get:
      tags: [identity]
      operationId: identity_get_me
      summary: My account (REQ-F-ACC-02)
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [identity]
      operationId: identity_update_me
      summary: Edit name, language, avatar (REQ-F-ACC-01/02/04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/password:
    post:
      tags: [identity]
      operationId: identity_change_password
      summary: Change password; revokes other sessions (REQ-F-ACC-03)
      requestBody:
        required: true
        content:
          application/json:
            example: {"current_password": "correct horse battery", "new_password": "a new long passphrase"}
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Changed. }

        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  # ---------------------------------------------------------------- home
  /couple:
    get:
      tags: [home]
      operationId: home_get_couple
      summary: Couple header (REQ-F-HOME-01)
      responses:
        "200":
          description: Header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Couple" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /home:
    get:
      tags: [home]
      operationId: home_get_dashboard
      summary: Header + favorites timeline of both partners (REQ-F-HOME-01/02)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeDashboard" }

        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  # ---------------------------------------------------------------- cards
  /cards/today:
    get:
      tags: [cards]
      operationId: cards_list_today
      summary: Today's cards, or one random past card (REQ-F-CARD-01/02/04)
      responses:
        "200":
          description: Same order for both partners.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayCards" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /cards/mine:
    get:
      tags: [cards]
      operationId: cards_list_mine
      summary: Cards I created (REQ-F-CARD-05)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /cards/pending-count:
    get:
      tags: [cards]
      operationId: cards_get_pending_count
      summary: Counter of the partner's scheduled cards — no content, no dates (REQ-F-CARD-06)
      responses:
        "200":
          description: Counter.
          content:
            application/json:
              example: {"count": 2}
              schema:
                type: object
                required: [count]
                properties: { count: { type: integer, minimum: 0 } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /cards/{card_id}:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    get:
      tags: [cards]
      operationId: cards_get_card
      summary: Card detail (partner's scheduled card → 404, ADR-005 §4)
      responses:
        "200": { description: Card., content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cards]
      operationId: cards_upsert_card
      summary: Create or edit a scheduled card with a client UUIDv7 (REQ-F-CARD-05/07, REQ-F-SYNC-03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } }
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CardAlreadyPublished" }
        "410": { $ref: "#/components/responses/EntityDeleted" }
    delete:
      tags: [cards]
      operationId: cards_delete_card
      summary: Delete a scheduled card (REQ-F-CARD-07)
      responses:
        "204": { description: Tombstoned. }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CardAlreadyPublished" }
  # ---------------------------------------------------------------- memories
  /memories:
    get:
      tags: [memories]
      operationId: memories_list_memories
      summary: Gallery ordered by memory_date (REQ-F-MEM-01/07)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Page., content: { application/json: { schema: { $ref: "#/components/schemas/MemoryPage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /memories/{memory_id}:
    parameters: [{ $ref: "#/components/parameters/MemoryId" }]
    get:
      tags: [memories]
      operationId: memories_get_memory
      summary: Memory detail
      responses:
        "200": { description: Memory., content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [memories]
      operationId: memories_upsert_memory
      summary: Create or edit own memory (REQ-F-MEM-07/08/10)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } } }
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MediaRejected" }
        "410": { $ref: "#/components/responses/EntityDeleted" }
    delete:
      tags: [memories]
      operationId: memories_delete_memory
      summary: Delete own memory (REQ-F-MEM-07)
      responses:
        "204": { description: Tombstoned. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
  /songs:
    get:
      tags: [memories]
      operationId: memories_list_songs
      summary: Couple song list (REQ-F-SONG-01)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Page., content: { application/json: { schema: { $ref: "#/components/schemas/SongPage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /songs/{song_id}:
    parameters: [{ $ref: "#/components/parameters/SongId" }]
    get:
      tags: [memories]
      operationId: memories_get_song
      summary: Song with related memory IDs (REQ-F-SONG-03/07)
      responses:
        "200": { description: Song., content: { application/json: { schema: { $ref: "#/components/schemas/Song" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [memories]
      operationId: memories_upsert_song
      summary: Create or edit own song (REQ-F-SONG-05/06/08)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SongInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Song" } } } }
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Song" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MediaRejected" }
        "410": { $ref: "#/components/responses/EntityDeleted" }
    delete:
      tags: [memories]
      operationId: memories_delete_song
      summary: Delete own song (REQ-F-SONG-08)
      responses:
        "204": { description: Tombstoned; memories keep existing without song. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
  /places:
    get:
      tags: [memories]
      operationId: memories_list_places
      summary: Places with memory counts for the map (REQ-F-PLACE-02)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Page., content: { application/json: { schema: { $ref: "#/components/schemas/PlacePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /places/{place_id}:
    parameters: [{ $ref: "#/components/parameters/PlaceId" }]
    get:
      tags: [memories]
      operationId: memories_get_place
      summary: Place with its memory IDs (REQ-F-PLACE-03)
      responses:
        "200": { description: Place., content: { application/json: { schema: { $ref: "#/components/schemas/Place" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [memories]
      operationId: memories_upsert_place
      summary: Create or edit own place (REQ-F-PLACE-01/05)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaceInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Place" } } } }
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Place" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/EntityDeleted" }
    delete:
      tags: [memories]
      operationId: memories_delete_place
      summary: Delete own place; its memories are unlinked (REQ-F-PLACE-05)
      responses:
        "204": { description: Tombstoned. }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- diary
  /notes:
    get:
      tags: [diary]
      operationId: diary_list_notes
      summary: Shared notes + my only_me notes (REQ-F-NOTE-02/03)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Page., content: { application/json: { schema: { $ref: "#/components/schemas/NotePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /notes/{note_id}:
    parameters: [{ $ref: "#/components/parameters/NoteId" }]
    get:
      tags: [diary]
      operationId: diary_get_note
      summary: Note reader (partner's only_me → 404)
      responses:
        "200": { description: Note., content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [diary]
      operationId: diary_upsert_note
      summary: Create or edit own note (REQ-F-NOTE-01/02/05)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/EntityDeleted" }
    delete:
      tags: [diary]
      operationId: diary_delete_note
      summary: Delete own note (REQ-F-NOTE-05)
      responses:
        "204": { description: Tombstoned. }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAuthor" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- favorites
  /favorites:
    get:
      tags: [favorites]
      operationId: favorites_list_mine
      summary: My favorites, optionally filtered by type (REQ-F-FAV-01/02)
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/FavoriteItemType" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Page., content: { application/json: { schema: { $ref: "#/components/schemas/FavoritePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /favorites/{favorite_id}:
    parameters: [{ $ref: "#/components/parameters/FavoriteId" }]
    put:
      tags: [favorites]
      operationId: favorites_star_item
      summary: Star an item (REQ-F-MEM-06, REQ-F-SONG-04, REQ-F-PLACE-04, REQ-F-NOTE-04)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FavoriteInput" } } }
      responses:
        "201": { description: Starred., content: { application/json: { schema: { $ref: "#/components/schemas/Favorite" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AlreadyFavorited" }
    delete:
      tags: [favorites]
      operationId: favorites_unstar_item
      summary: Remove a favorite (REQ-F-FAV-01)
      responses:
        "204": { description: Unstarred. }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- media
  /media/uploads:
    post:
      tags: [media]
      operationId: media_create_upload
      summary: Reserve quota and get a presigned POST (ADR-007 §2, REQ-F-MEM-10)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadInput" } } }
      responses:
        "201": { description: Presigned POST., content: { application/json: { schema: { $ref: "#/components/schemas/PresignedPost" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/UploadRefused" }
  /media/uploads/{media_id}/complete:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    post:
      tags: [media]
      operationId: media_complete_upload
      summary: Mark upload finished; validation runs in the worker (ADR-007 §3)
      responses:
        "202": { description: Validation enqueued., content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MediaRejected" }
  /media/urls:
    post:
      tags: [media]
      operationId: media_create_signed_urls
      summary: Batch of signed GET URLs, 10 min (ADR-007 §5, REQ-N-SEC-06)
      requestBody:
        required: true
        content:
          application/json:
            example: {"items": [{"media_id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "variant": "thumb_400"}]}
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [media_id, variant]
                    properties:
                      media_id: { $ref: "#/components/schemas/Uuid" }
                      variant: { type: string, examples: [thumb_400, display_1600, poster_800, original] }
      responses:
        "200":
          description: URLs for visible items; invisible ones are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      required: [media_id, variant, url, expires_at]
                      properties:
                        media_id: { $ref: "#/components/schemas/Uuid" }
                        variant: { type: string }
                        url: { type: string, format: uri }
                        expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /media/{media_id}:
    parameters: [{ $ref: "#/components/parameters/MediaId" }]
    get:
      tags: [media]
      operationId: media_get_asset
      summary: Asset status and variants
      responses:
        "200": { description: Asset., content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- notifications
  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: notifications_get_preferences
      summary: Read my notification toggles (REQ-F-ACC-05)
      responses:
        "200": { description: Preferences., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [notifications]
      operationId: notifications_update_preferences
      summary: Toggle per type (REQ-F-NOTIF-04, REQ-F-ACC-05)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/devices:
    post:
      tags: [notifications]
      operationId: notifications_register_device
      summary: Register an Expo token or Web Push subscription (REQ-F-NOTIF-03)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeviceInput" } } }
      responses:
        "201": { description: Registered., content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/devices/{device_id}:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    delete:
      tags: [notifications]
      operationId: notifications_delete_device
      summary: Unregister a device (REQ-F-NOTIF-03)
      responses:
        "204": { description: Removed. }

        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- sync
  /sync/push:
    post:
      tags: [sync]
      operationId: sync_push_operations
      summary: Ordered batch of queued mutations (ADR-006 §2)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncPushInput" } } }
      responses:
        "200": { description: One result per op., content: { application/json: { schema: { $ref: "#/components/schemas/SyncPushResult" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /sync/pull:
    get:
      tags: [sync]
      operationId: sync_pull_changes
      summary: Changes after a cursor, filtered for this actor (ADR-006 §4)
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Changes., content: { application/json: { schema: { $ref: "#/components/schemas/SyncPullResult" } } } }

        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/CursorExpired" }
  # ---------------------------------------------------------------- audit
  /views:
    post:
      tags: [audit]
      operationId: audit_record_views
      summary: Batch of views read from the local store, queued offline (REQ-F-LOG-01, REQ-F-ADM-06, DEC-049)
      description: |
        Metadata only, never content. Retries are idempotent by view `id`. A view of an entity the actor
        cannot see is dropped silently (no 404), so the response never reveals that an ID exists (ADR-005 §4).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViewsInput" } } }
      responses:
        "202": { description: Accepted for the audit log. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: cl_refresh }

  parameters:
    RequestId: { name: X-Request-ID, in: header, required: false, schema: { type: string, maxLength: 64 } }
    ClientHeader: { name: X-CherryLove-Client, in: header, required: false, description: "Required as `web` on cookie-based calls (ADR-004 §2).", schema: { type: string, enum: [web, mobile] } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    InviteToken: { name: token, in: path, required: true, schema: { type: string } }
    CardId: { name: card_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    MemoryId: { name: memory_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    SongId: { name: song_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    PlaceId: { name: place_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    NoteId: { name: note_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    FavoriteId: { name: favorite_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    MediaId: { name: media_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    DeviceId: { name: device_id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }

  responses:
    ValidationFailed:
      description: "Invalid input; field errors in `errors[]` with `FieldErrorCode` values (ADR-010 §1, DEC-046)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [validation_failed] } } }]
          example: {"type": "/problems/validation-failed", "title": "Invalid input", "status": 400, "code": "validation_failed", "request_id": "9f1c2b7e4a5d4c3b", "errors": [{"pointer": "/body", "code": "too_long", "params": {"max": 2000}}]}
    Unauthenticated:
      description: "Missing, invalid or expired token (ADR-004)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [not_authenticated, token_expired] } } }]
          example: {"type": "/problems/token-expired", "title": "Token expired", "status": 401, "code": "token_expired", "request_id": "9f1c2b7e4a5d4c3b"}
    InvalidCredentials:
      description: "Wrong email or password; same answer for an unknown email (ADR-004 §4)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [invalid_credentials] } } }]
          example: {"type": "/problems/invalid-credentials", "title": "Invalid credentials", "status": 401, "code": "invalid_credentials", "request_id": "9f1c2b7e4a5d4c3b"}
    NotAuthor:
      description: "The item is visible but only its author may change it (ADR-005 §4)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [not_author] } } }]
          example: {"type": "/problems/not-author", "title": "Not the author", "status": 403, "code": "not_author", "request_id": "9f1c2b7e4a5d4c3b"}
    ClientHeaderRequired:
      description: "Cookie-based call without `X-CherryLove-Client: web` (CSRF defense, ADR-004 §2)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [client_header_required] } } }]
          example: {"type": "/problems/client-header-required", "title": "Client header required", "status": 403, "code": "client_header_required", "request_id": "9f1c2b7e4a5d4c3b"}
    NotFound:
      description: "Not found or not visible to this actor (ADR-005 §4)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [not_found] } } }]
          example: {"type": "/problems/not-found", "title": "Not found", "status": 404, "code": "not_found", "request_id": "9f1c2b7e4a5d4c3b"}
    InviteConflict:
      description: "The invite can no longer be used (REQ-F-AUTH-02/05, DEC-017, DEC-019)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [invite_expired, invite_revoked, couple_full, couple_archived] } } }]
          example: {"type": "/problems/invite-expired", "title": "Invite expired", "status": 409, "code": "invite_expired", "request_id": "9f1c2b7e4a5d4c3b"}
    CoupleArchived:
      description: "The account's couple is archived; login is refused (REQ-F-AUTH-09, DEC-019)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [couple_archived] } } }]
          example: {"type": "/problems/couple-archived", "title": "Couple archived", "status": 409, "code": "couple_archived", "request_id": "9f1c2b7e4a5d4c3b"}
    CardAlreadyPublished:
      description: "Published cards are read-only (REQ-F-CARD-07, DEC-024)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [card_already_published] } } }]
          example: {"type": "/problems/card-already-published", "title": "Card already published", "status": 409, "code": "card_already_published", "request_id": "9f1c2b7e4a5d4c3b"}
    MediaRejected:
      description: "The referenced media failed validation or is not usable (ADR-007 §3)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [media_rejected] } } }]
          example: {"type": "/problems/media-rejected", "title": "Media rejected", "status": 409, "code": "media_rejected", "request_id": "9f1c2b7e4a5d4c3b", "params": {"rejection_code": "type_mismatch"}}
    AlreadyFavorited:
      description: "The item is already starred under another favorite ID (IMPL-API-001 F6.3)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [already_favorited] } } }]
          example: {"type": "/problems/already-favorited", "title": "Already favorited", "status": 409, "code": "already_favorited", "request_id": "9f1c2b7e4a5d4c3b"}
    UploadRefused:
      description: "Per-file limit or couple quota exceeded (REQ-F-MEM-09/10, DEC-020)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [file_too_large, quota_exceeded] } } }]
          example: {"type": "/problems/quota-exceeded", "title": "Quota exceeded", "status": 409, "code": "quota_exceeded", "request_id": "9f1c2b7e4a5d4c3b", "params": {"limit_bytes": 5368709120}}
    EntityDeleted:
      description: "The entity was deleted (tombstoned); it cannot be edited again (ADR-006 §3)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [entity_deleted] } } }]
          example: {"type": "/problems/entity-deleted", "title": "Entity deleted", "status": 410, "code": "entity_deleted", "request_id": "9f1c2b7e4a5d4c3b"}
    CursorExpired:
      description: "The cursor is older than the purge horizon; run a full resync (ADR-006 §4, DEC-045)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [cursor_expired] } } }]
          example: {"type": "/problems/cursor-expired", "title": "Cursor expired", "status": 410, "code": "cursor_expired", "request_id": "9f1c2b7e4a5d4c3b"}
    RateLimited:
      description: "Throttled (REQ-N-SEC-04)."
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: "Seconds to wait" }
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [rate_limited] } } }]
          example: {"type": "/problems/rate-limited", "title": "Too many requests", "status": 429, "code": "rate_limited", "request_id": "9f1c2b7e4a5d4c3b"}
    ServiceUnavailable:
      description: "A dependency is down; auth throttles fail closed (ADR-004 §4, ADR-011 §2)."
      content:
        application/problem+json:
          schema:
            allOf: [{ $ref: "#/components/schemas/Problem" }, { properties: { code: { enum: [service_unavailable] } } }]
          example: {"type": "/problems/service-unavailable", "title": "Service unavailable", "status": 503, "code": "service_unavailable", "request_id": "9f1c2b7e4a5d4c3b"}

  schemas:
    Uuid: { type: string, format: uuid, description: "UUIDv7" }
    CivilDate: { type: string, format: date, description: "YYYY-MM-DD, no time zone (DEC-024)" }
    Timestamp: { type: string, format: date-time, description: "ISO 8601 UTC with Z" }
    NextCursor: { type: [string, "null"] }
    Language: { type: string, enum: [es, en] }

    ErrorCode:
      type: string
      description: Stable codes (ADR-010 §2). Each 4xx response narrows them per endpoint.
      enum:
        - validation_failed
        - not_authenticated
        - token_expired
        - invalid_credentials
        - not_author
        - client_header_required
        - not_found
        - card_already_published
        - quota_exceeded
        - file_too_large
        - media_rejected
        - invite_expired
        - invite_revoked
        - email_already_in_couple
        - couple_full
        - couple_archived
        - already_favorited
        - cursor_expired
        - entity_deleted
        - rate_limited
        - internal_error
        - service_unavailable
    FieldErrorCode:
      type: string
      description: |
        Codes for `Problem.errors[].code` (DEC-046, additive). Clients translate `validation.<code>` (ADR-010 §6).
        Shape: required, null_not_allowed, invalid_type, invalid_format, invalid_choice, too_short, too_long,
        below_minimum, above_maximum, too_few_items, too_many_items, not_https. Rules: invalid_uuid_version and
        timestamp_too_far_ahead (client UUIDv7, ADR-006 §8), exactly_one_required (memory media_id / external_url),
        invalid_reference (missing, foreign or deleted song/place/memory), invalid_media (media not pending/ready,
        not owned by the author or of another kind), unsupported_provider_url (Spotify/YouTube link not parsed),
        push_host_not_allowed (Web Push endpoint outside the allowlist), incorrect_password (current password on
        change), invalid_token (recovery token wrong, expired or used), invalid_cursor (tampered or foreign cursor).
      enum:
        - required
        - null_not_allowed
        - invalid_type
        - invalid_format
        - invalid_choice
        - too_short
        - too_long
        - below_minimum
        - above_maximum
        - too_few_items
        - too_many_items
        - not_https
        - invalid_uuid_version
        - timestamp_too_far_ahead
        - exactly_one_required
        - invalid_reference
        - invalid_media
        - unsupported_provider_url
        - push_host_not_allowed
        - incorrect_password
        - invalid_token
        - invalid_cursor
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, examples: ["/problems/card-already-published"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        request_id: { type: string }
        params: { type: object, additionalProperties: true }
        errors:
          type: array
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: { type: string, examples: ["/body"] }
              code: { $ref: "#/components/schemas/FieldErrorCode" }
              params: { type: object, additionalProperties: true }

    # identity
    LoginInput:
      examples:
        - {"email": "camila@example.com", "password": "correct horse battery", "client": "mobile"}
      type: object
      required: [email, password, client]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        client: { type: string, enum: [web, mobile] }
    RefreshInput:
      examples:
        - {"refresh": "eyJhbGciOiJIUzI1NiJ9.refresh"}
      type: object
      description: Mobile sends the refresh token in the body; web sends nothing (cookie).
      properties: { refresh: { type: string } }
    TokenPair:
      examples:
        - {"access": "eyJhbGciOiJIUzI1NiJ9.access", "access_expires_at": "2026-11-18T14:05:00Z", "refresh": "eyJhbGciOiJIUzI1NiJ9.refresh"}
      type: object
      required: [access, access_expires_at]
      properties:
        access: { type: string }
        access_expires_at: { $ref: "#/components/schemas/Timestamp" }
        refresh: { type: string, description: "Mobile only; never present for web." }
    InvitePreview:
      examples:
        - {"email": "andres@example.com", "relationship_start_known": true}
      type: object
      required: [email, relationship_start_known]
      properties:
        email: { type: string, format: email }
        relationship_start_known: { type: boolean, description: "If true, onboarding skips the date (REQ-F-AUTH-04)." }
    OnboardingInput:
      examples:
        - {"name": "Andrés", "birth_date": "1995-06-01", "password": "correct horse battery", "language": "es"}
      type: object
      required: [name, birth_date, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        birth_date: { $ref: "#/components/schemas/CivilDate" }
        password: { type: string, minLength: 10 }
        relationship_start: { $ref: "#/components/schemas/CivilDate" }
        language: { $ref: "#/components/schemas/Language" }
    PersonSummary:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        avatar_media_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
    Me:
      examples:
        - {"id": "0193a5b2-7c3e-7d4a-9f00-1b2c3d4e5f60", "email": "camila@example.com", "name": "Camila", "birth_date": "1996-03-09", "language": "es", "avatar_media_id": null, "partner": {"id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "name": "Andrés", "avatar_media_id": null}}
      type: object
      required: [id, email, name, language]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        name: { type: string }
        birth_date: { $ref: "#/components/schemas/CivilDate" }
        language: { $ref: "#/components/schemas/Language" }
        avatar_media_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        partner: { oneOf: [{ $ref: "#/components/schemas/PersonSummary" }, { type: "null" }] }
    MeInput:
      examples:
        - {"name": "Cami", "language": "en"}
      type: object
      description: Birth date is admin-only (DEC-025).
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        language: { $ref: "#/components/schemas/Language" }
        avatar_media_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }

    # home
    Couple:
      examples:
        - {"id": "0193a5b2-af61-7a7d-8233-4e5f60718293", "partners": [{"id": "0193a5b2-7c3e-7d4a-9f00-1b2c3d4e5f60", "name": "Camila", "avatar_media_id": null}, {"id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "name": "Andrés", "avatar_media_id": null}], "relationship_start": "2023-02-14", "days_together": 1373, "timezone": "America/Bogota", "version": 3}
      type: object
      required: [id, partners, timezone, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        partners: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/PersonSummary" } }
        relationship_start: { oneOf: [{ $ref: "#/components/schemas/CivilDate" }, { type: "null" }] }
        days_together: { type: [integer, "null"], description: "Civil days in couple timezone (DEC-024)" }
        timezone: { type: string, examples: [America/Bogota] }
        version: { type: integer }
    TimelineItem:
      type: object
      required: [item_type, item_id, starred_by, starred_at]
      properties:
        item_type: { $ref: "#/components/schemas/FavoriteItemType" }
        item_id: { $ref: "#/components/schemas/Uuid" }
        starred_by: { type: array, items: { $ref: "#/components/schemas/Uuid" } }
        starred_at: { $ref: "#/components/schemas/Timestamp" }
        item_date: { $ref: "#/components/schemas/CivilDate" }
    HomeDashboard:
      examples:
