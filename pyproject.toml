[project]
name = "cherrylove-api"
version = "0.0.0"
description = "CherryLove API, Django Admin and worker"
readme = "README.md"
requires-python = "==3.14.10"
dependencies = [
  "boto3==1.44.6",
  "django==5.2.19",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "gunicorn==27.0.1",
  "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
  "django-stubs==6.1.2",
  "djangorestframework-stubs==3.18.2",
  "import-linter==2.16",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pyyaml==6.0.3",
  "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
markers = [
  "req(id): requirement the test proves (ADR-014 §6, REQ-N-QA-06)",
  "integration: needs real infrastructure (Docker)",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", ".", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "DJ", "PT", "TC", "C4", "PL"]
ignore = [
  "PLR2004",  # magic values are expected in test assertions and HTTP statuses
  "TC001", "TC002", "TC003",  # runtime imports kept simple; `from __future__ import annotations` everywhere
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "S607", "S608", "PLR0913"]
# Django migration idioms: class-level lists; SQL built from module constants, never from input.
"**/migrations/*" = ["RUF012", "S608"]
"scripts/**" = ["S603", "S607"]
"tests/integration/test_settings.py" = ["S105"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "importlinter.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
branch = true
source = ["src", "config", "scripts"]
# Measure code run in subprocesses too (manage.py check --deploy on production settings).
patch = ["subprocess"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
