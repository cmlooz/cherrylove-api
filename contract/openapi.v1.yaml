      examples:
        - {"id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "kind": "photo", "status": "ready", "variants": ["thumb_400", "display_1600"], "rejection_code": null}
      type: object
      required: [id, kind, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [photo, video, audio, avatar] }
        status: { type: string, enum: [pending, ready, rejected, deleted] }
        variants: { type: array, items: { type: string } }
        rejection_code: { type: [string, "null"] }

    # notifications
    NotificationPreferences:
      examples:
        - {"card_published": true, "anniversary": true, "partner_birthday": false}
      type: object
      required: [card_published, anniversary, partner_birthday]
      properties:
        card_published: { type: boolean }
        anniversary: { type: boolean }
        partner_birthday: { type: boolean }
    DeviceInput:
      oneOf:
        - { $ref: "#/components/schemas/DeviceInputExpo" }
        - { $ref: "#/components/schemas/DeviceInputWebPush" }
      discriminator:
        propertyName: channel
        mapping:
          expo: "#/components/schemas/DeviceInputExpo"
          webpush: "#/components/schemas/DeviceInputWebPush"
    DeviceInputExpo:
      type: object
      required: [channel, expo_token]
      properties: { channel: { const: expo }, expo_token: { type: string } }
    DeviceInputWebPush:
      type: object
      required: [channel, subscription]
      properties:
        channel: { const: webpush }
        subscription:
          type: object
          required: [endpoint, keys]
          properties:
            endpoint: { type: string, format: uri }
            keys:
              type: object
              required: [p256dh, auth]
              properties: { p256dh: { type: string }, auth: { type: string } }
    Device:
      examples:
        - {"id": "0193a5b2-9e50-7f6c-b122-3d4e5f607182", "channel": "expo"}
      type: object
      required: [id, channel]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        channel: { type: string, enum: [expo, webpush] }

    # audit (DEC-049)
    ViewedEntityType: { type: string, enum: [card, memory, song, place, note] }
    ViewInput:
      type: object
      required: [id, entity_type, entity_id, viewed_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid", description: "Client UUIDv7 of this view; retries are idempotent" }
        entity_type: { $ref: "#/components/schemas/ViewedEntityType" }
        entity_id: { $ref: "#/components/schemas/Uuid" }
        viewed_at: { $ref: "#/components/schemas/Timestamp" }
    ViewsInput:
      type: object
      required: [views]
      properties:
        views: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ViewInput" } }
      examples:
        - { views: [{ id: "0193a5b2-af61-7a7d-8233-4e5f60718293", entity_type: memory, entity_id: "0193a5b2-8d4f-7e5b-a011-2c3d4e5f6071", viewed_at: "2026-11-18T14:00:00Z" }] }

    # sync
    SyncEntityType:
      type: string
      enum: [card, memory, song, place, note, favorite, couple, media_asset]
      description: |
        `couple` and `media_asset` are pull-only: a push op with them is `rejected`. A `media_asset` change carries
        the `MediaAsset` record, so devices learn `ready` / `rejected` and the rejection code (DEC-050, ADR-007 §2).
    SyncOperation:
      type: object
      required: [client_op_id, entity_type, entity_id, op]
      properties:
        client_op_id: { $ref: "#/components/schemas/Uuid" }
        entity_type: { $ref: "#/components/schemas/SyncEntityType" }
        entity_id: { $ref: "#/components/schemas/Uuid" }
        op: { type: string, enum: [upsert, delete] }
        base_version: { type: integer }
        payload: { type: object, additionalProperties: true, description: "Same shape as the entity's *Input schema" }
    SyncPushInput:
      examples:
        - {"operations": [{"client_op_id": "0193a5b2-af61-7a7d-8233-4e5f60718293", "entity_type": "note", "entity_id": "0193a5b2-8d4f-7e5b-a011-2c3d4e5f6071", "op": "upsert", "base_version": 1, "payload": {"body": "Editado sin conexión"}}]}
      type: object
      required: [operations]
      properties:
        operations: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/SyncOperation" } }
    SyncOpResult:
      type: object
      required: [client_op_id, result]
      properties:
        client_op_id: { $ref: "#/components/schemas/Uuid" }
        result: { type: string, enum: [applied, rejected, gone] }
        version: { type: integer }
