# Weekly dependency updates, grouped per ecosystem (ADR-015 §3). Its PRs pass the same `ci`.
# `uv` instead of `pip`: the pip ecosystem cannot update uv.lock. Every bump must still match pins.toml
# (tests/architecture/test_toolchain.py), so Dependabot PRs also update the pin with Camilo's OK.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Django stays on the 5.2 LTS line until the ecosystem declares 6.x support (ADR-016 Decision 1).
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
